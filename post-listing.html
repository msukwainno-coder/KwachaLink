<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post a Listing | KwachaLink</title><link rel="stylesheet" href="./style.css"><script src="./script.js" defer></script></head><body>
<header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">K</span><span>Kwacha<span class="brand-link">Link</span><small>Connect. Exchange. Grow.</small></span></a><a class="btn btn-outline" href="dashboard.html">Dashboard</a></div></header>
<main class="auth-main"><section class="auth-card auth-card-wide"><p class="eyebrow">SHARE A CONNECTION</p><h1>Post a listing</h1><p class="muted">Sign in is required before publishing. Keep sensitive account details out of public descriptions.</p><form class="demo-form" data-message="This listing form is a front-end template only. Connect it to the authenticated backend endpoint before publishing listings."><label>What do you want to post?<select name="listingType" required><option value="">Choose a listing type</option><option value="exchange">I have currency to offer</option><option value="need-currency">I need currency</option><option value="payment">I need or offer payment help</option></select></label><label>Listing title<input name="title" required maxlength="90" placeholder="e.g. I have US dollars available"></label><label>Short public description<textarea name="summary" required maxlength="240" rows="3" placeholder="Describe the connection you are looking for"></textarea></label><div class="form-grid"><label>Currency (if applicable)<input name="currency" placeholder="e.g. USD, AED, CNY"></label><label>Amount<input name="amount" inputmode="decimal" placeholder="Approximate amount"></label></div><label>Full details (private to eligible members)<textarea name="details" required rows="4" placeholder="Include destination, timing and requirements. Do not include passwords or banking PINs."></textarea></label><label>Preferred contact method<select name="contact"><option>WhatsApp</option><option>In-platform message</option></select></label><button class="btn btn-primary btn-wide" type="submit">Continue to log in</button><p class="form-status" aria-live="polite"></p></form><p class="auth-switch">Don't have an account? <a href="register.html">Register first</a></p></section></main><footer class="minimal-footer">Built by ElevateMw · <a href="mailto:Elevate2@gmail.com">Elevate2@gmail.com</a> · 0991 939 273</footer></body></html>
