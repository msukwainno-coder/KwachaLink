<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | KwachaLink</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head><body>
<header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">K</span><span>Kwacha<span class="brand-link">Link</span><small>Connect. Exchange. Grow.</small></span></a><a class="btn btn-outline" href="index.html">Back to home</a></div></header>
<main class="auth-main"><section class="auth-card"><p class="eyebrow">JOIN THE COMMUNITY</p><h1>Create your account</h1><p class="muted">Register before posting currency offers or payment requests.</p><form class="demo-form" data-message="This registration form is a front-end template. Connect it to your backend authentication endpoint before using it with real accounts."><label>Full name<input name="fullName" autocomplete="name" required placeholder="Your full name"></label><label>Email address<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Phone number<input name="phone" type="tel" autocomplete="tel" required placeholder="+265…"></label><label>Preferred language<select name="language"><option value="en">English</option><option value="ch">Chichewa (CH)</option></select></label><label>Password<input name="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters"></label><label>Confirm password<input name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Repeat password"></label><label class="check-row"><input type="checkbox" required> I agree to the terms and understand I must verify people before transacting.</label><button class="btn btn-primary btn-wide" type="submit">Create account</button><p class="form-status" aria-live="polite"></p></form><p class="auth-switch">Already registered? <a href="login.html">Log in</a></p></section></main>
